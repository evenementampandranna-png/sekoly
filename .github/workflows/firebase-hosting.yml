# Alefa ho azy any amin'ny Firebase Hosting (https://<projet>.web.app) isaky ny misy fanovana ao amin'ny "main".
# Ilaina: GitHub → Settings → Secrets and variables → Actions
#   FIREBASE_SERVICE_ACCOUNT : votoatin'ny rakitra JSON (Firebase → Project settings → Service accounts → Generate new private key)

name: Deploy Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: sekoly-ampandrana
          channelId: live
      - name: Deploy Firestore rules
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project sekoly-ampandrana --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
